[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = [
    # B008 : "ne pas appeler de fonction dans une valeur par défaut".
    # Faux positif ici -- Depends(...) en valeur par défaut est LE pattern
    # officiel d'injection de dépendances de FastAPI, pas un bug.
    "B008",
]
